name: Build EndpointControl
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix src/MeshAll.Server ci
      - run: npm --prefix src/MeshAll.Server audit --audit-level=moderate
      - run: dotnet restore MeshAll.slnx --force-evaluate -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate
      - run: sudo apt-get update && sudo apt-get install -y wixl msitools
      - run: npm --prefix src/MeshAll.Server run format:check
      - run: npm --prefix src/MeshAll.Server run build
      - run: dotnet build MeshAll.slnx -c Release
      - run: dotnet format whitespace MeshAll.slnx --verify-no-changes --no-restore
      - run: dotnet format style MeshAll.slnx --verify-no-changes --no-restore --diagnostics IDE0005 IDE0008 IDE0011 --severity info
      - run: dotnet test tests/MeshAll.Tests/MeshAll.Tests.csproj -c Release --no-build
      - run: node --test tests/desktop-session.test.mjs tests/remote-session.test.mjs tests/screen-consent.test.cjs tests/consent-dialog.test.cjs tests/notifybar.test.cjs tests/inventory.test.cjs tests/guacamole-protocol.test.mjs
      - run: bash -n install.sh
      - run: python3 tests/source_packaging.py
      - run: python3 tests/branding.py
      - run: python3 -O tests/native_artifact_import.py
      - run: python3 tests/msi_packaging.py
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v3
      - name: Prepare native source metadata
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $date = git show -s --format=%cI HEAD
          "#define SOURCE_COMMIT_HASH `"$sha`"`n#define SOURCE_COMMIT_DATE `"$date`"" | Set-Content components/agent-native/microscript/ILibDuktape_Commit.h -Encoding utf8
      - name: Build native agent
        run: msbuild components/agent-native/meshservice/MeshService-2022.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: EndpointControl-native-agent-win-x64
          path: |
            components/agent-native/**/MeshService64.exe
            components/agent-native/**/MeshAllAgent.exe
